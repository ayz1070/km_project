<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그아웃 - KM Spring Boot</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0d6efd;
            --light-gray: #f8f9fa;
            --dark-text: #212529;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
        }

        .logout-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .logout-header {
            background-color: #dc3545;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .logout-header h1 {
            font-weight: 700;
            margin: 0;
        }

        .logout-body {
            padding: 2rem;
            text-align: center;
        }

        .logout-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 2rem;
            font-weight: 500;
            margin: 0.5rem;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 2rem;
            font-weight: 500;
            margin: 0.5rem;
        }
        
        .footer {
            padding: 1rem 0;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <header class="text-center py-4">
        <h2>KOREA MARKERS</h2>
    </header>

    <main class="main-content d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card logout-card">
                        <div class="logout-header">
                            <h1>로그아웃</h1>
                        </div>
                        <div class="card-body logout-body">
                            <i class="bi bi-box-arrow-right logout-icon"></i>
                            <h4 class="mb-3">로그아웃 하시겠습니까?</h4>
                            <p class="text-muted mb-4">
                                현재 세션이 종료되고 로그인 페이지로 이동합니다.
                            </p>
                            
                            <div class="d-flex justify-content-center flex-wrap">
                                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>로그아웃
                                    </button>
                                </form>
                                <a href="/dashboard" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>취소
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 KOREA MARKERS. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
