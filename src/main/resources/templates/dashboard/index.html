<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - KM Spring Boot</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --light-gray: #f8f9fa;
            --dark-text: #212529;
            --border-color: #dee2e6;
            --card-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-text);
        }

        .navbar {
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075);
        }

        .navbar-brand {
            font-weight: 700;
        }

        .main-content {
            padding-top: 4rem;
            padding-bottom: 4rem;
        }

        .hero-section {
            background-color: white;
            padding: 4rem 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
        }

        .hero-section h1 {
            font-weight: 700;
        }

        .info-card {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            height: 100%;
        }

        .info-card h5 {
            font-weight: 500;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .info-card ul {
            padding-left: 0;
            list-style: none;
        }

        .info-card ul li {
            margin-bottom: 0.75rem;
        }

        .footer {
            background-color: #343a40;
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">MARKERS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="principal.fullName"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li>
                                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right me-2"></i>로그아웃
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="hero-section text-center">
                <h1 class="display-5">환영합니다!</h1>
                <p class="lead">
                    <strong th:text="${user.fullName}">사용자</strong>님, KOREA MARKER 로그인 시스템에 오신 것을 환영합니다.
                </p>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="info-card">
                        <h5><i class="bi bi-person-vcard me-2"></i>사용자 정보</h5>
                        <ul>
                            <li><strong>사용자명:</strong> <span th:text="${user.username}"></span></li>
                            <li><strong>이메일:</strong> <span th:text="${user.email}"></span></li>
                            <li><strong>권한:</strong> <span th:text="${user.role.name}"></span></li>
                            <li><strong>상태:</strong> <span th:text="${user.status.description}"></span></li>
                        </ul>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="info-card">
                        <h5><i class="bi bi-hdd-stack me-2"></i>시스템 정보</h5>
                        <ul>
                            <li><strong>현재 시간:</strong> <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span></li>
                            <li><strong>마지막 로그인:</strong>
                                <span th:if="${user.lastLoginAt}" th:text="${#temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                                <span th:unless="${user.lastLoginAt}" class="text-muted">첫 로그인</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="mb-0">&copy; 2025 KOREA MARKERS. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
